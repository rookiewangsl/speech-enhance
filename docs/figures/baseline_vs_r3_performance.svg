<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title description">
  <title id="title">MCRA加DD-Wiener基线与RNNoise R3性能对比</title>
  <desc id="description">冻结的八说话人VoiceBank加DEMAND验证集上，RNNoise R3平均SI-SDR提升更高，DD-Wiener正提升文件比例更高且速度更快。RNNoise在低SNR表现突出，在15 dB和babble条件退化。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .head { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .body { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .number { font: 700 19px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .r3 { fill: #fff7ed; stroke: #fb923c; }
      .dd { fill: #eff6ff; stroke: #60a5fa; }
      .good { fill: #166534; }
      .bad { fill: #b91c1c; }
      .orange { fill: #c2410c; }
      .blue { fill: #1d4ed8; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8; rx: 20; filter: url(#shadow); }
      .decision { fill: #f0fdf4; stroke: #4ade80; stroke-width: 2; rx: 18; }
      .warning { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 18; }
      .fallback { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 18; }
      .grid { stroke: #cbd5e1; stroke-width: 1.2; }
      .bar-r3 { fill: #f97316; }
      .bar-dd { fill: #3b82f6; }
      .zero { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .axis { stroke: #94a3b8; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1800" height="1180" fill="url(#bg)"/>
  <text x="64" y="66" class="title">经典基线 vs RNNoise R3：性能结论</text>
  <text x="66" y="102" class="subtitle">冻结协议：VoiceBank + DEMAND · 8个未见speaker · validation 3,224对 · 参数仅在development选择</text>

  <!-- Main table -->
  <rect x="54" y="140" width="1120" height="485" class="panel"/>
  <text x="82" y="184" class="section">全量 Validation 主结果</text>

  <rect x="80" y="210" width="1068" height="56" rx="10" fill="#f1f5f9"/>
  <text x="100" y="245" class="head">指标</text>
  <text x="585" y="245" text-anchor="middle" class="head">MCRA + DD-Wiener</text>
  <text x="920" y="245" text-anchor="middle" class="head">RNNoise R3</text>
  <text x="1125" y="245" text-anchor="end" class="head">更优</text>

  <line x1="80" y1="266" x2="1148" y2="266" class="grid"/>
  <line x1="80" y1="328" x2="1148" y2="328" class="grid"/>
  <line x1="80" y1="390" x2="1148" y2="390" class="grid"/>
  <line x1="80" y1="452" x2="1148" y2="452" class="grid"/>
  <line x1="80" y1="514" x2="1148" y2="514" class="grid"/>
  <line x1="80" y1="576" x2="1148" y2="576" class="grid"/>
  <line x1="425" y1="210" x2="425" y2="576" class="grid"/>
  <line x1="755" y1="210" x2="755" y2="576" class="grid"/>
  <line x1="1055" y1="210" x2="1055" y2="576" class="grid"/>

  <text x="100" y="306" class="body">Mean / median SI-SDRi</text>
  <text x="585" y="306" text-anchor="middle" class="number blue">+2.093 / +1.902 dB</text>
  <text x="920" y="306" text-anchor="middle" class="number orange">+3.123 / +3.567 dB</text>
  <text x="1125" y="306" text-anchor="end" class="head orange">R3</text>

  <text x="100" y="368" class="body">SI-SDRi &gt; 0 文件比例</text>
  <text x="585" y="368" text-anchor="middle" class="number blue">96.77%</text>
  <text x="920" y="368" text-anchor="middle" class="number orange">77.30%</text>
  <text x="1125" y="368" text-anchor="end" class="head blue">DD</text>

  <text x="100" y="430" class="body">Mean ΔSTOI</text>
  <text x="585" y="430" text-anchor="middle" class="number blue">−0.00579</text>
  <text x="920" y="430" text-anchor="middle" class="number orange">−0.00312</text>
  <text x="1125" y="430" text-anchor="end" class="head orange">R3*</text>

  <text x="100" y="492" class="body">ΔSTOI ≥ 0 文件比例</text>
  <text x="585" y="492" text-anchor="middle" class="number blue">24.19%</text>
  <text x="920" y="492" text-anchor="middle" class="number orange">58.87%</text>
  <text x="1125" y="492" text-anchor="end" class="head orange">R3</text>

  <text x="100" y="554" class="body">Mean RTF（越低越快）</text>
  <text x="585" y="554" text-anchor="middle" class="number blue">0.00711</text>
  <text x="920" y="554" text-anchor="middle" class="number orange">0.01470</text>
  <text x="1125" y="554" text-anchor="end" class="head blue">DD</text>

  <text x="82" y="605" class="small">* 两种方法的 mean ΔSTOI 都小于0；R3只是退化较小，不能表述为“整体可懂度提高”。</text>

  <!-- Decision cards -->
  <rect x="1210" y="140" width="536" height="485" class="panel"/>
  <text x="1238" y="184" class="section">工程决策</text>

  <rect x="1238" y="214" width="480" height="112" class="decision"/>
  <text x="1262" y="247" class="head good">默认 Demo：纯 R3</text>
  <text x="1262" y="277" class="body">低SNR、强噪声平均抑制更强</text>
  <text x="1262" y="305" class="body">关键金属结构噪声试听通过</text>

  <rect x="1238" y="350" width="480" height="112" class="fallback"/>
  <text x="1262" y="383" class="head blue">保留基线：DD-Wiener</text>
  <text x="1262" y="413" class="body">正收益比例高、速度快、可解释</text>
  <text x="1262" y="441" class="body">高SNR和babble条件更稳定</text>

  <rect x="1238" y="486" width="480" height="112" class="warning"/>
  <text x="1262" y="519" class="head bad">边界：不存在全场景最优</text>
  <text x="1262" y="549" class="body">R3会在高SNR、竞争人声中过处理</text>
  <text x="1262" y="577" class="body">R4回混会重新引入结构噪声</text>

  <!-- SNR chart -->
  <rect x="54" y="664" width="1120" height="430" class="panel"/>
  <text x="82" y="708" class="section">按输入 SNR 分层：Mean SI-SDRi（dB）</text>
  <rect x="875" y="688" width="18" height="18" rx="3" class="bar-r3"/>
  <text x="901" y="704" class="small">R3</text>
  <rect x="958" y="688" width="18" height="18" rx="3" class="bar-dd"/>
  <text x="984" y="704" class="small">DD-Wiener</text>

  <line x1="130" y1="995" x2="1110" y2="995" class="axis"/>
  <line x1="130" y1="766" x2="130" y2="1035" class="axis"/>
  <line x1="130" y1="938" x2="1110" y2="938" class="zero"/>
  <text x="118" y="943" text-anchor="end" class="small">0</text>
  <text x="118" y="828" text-anchor="end" class="small">4</text>
  <text x="118" y="771" text-anchor="end" class="small">6</text>
  <text x="118" y="1000" text-anchor="end" class="small">−2</text>

  <!-- 0 dB -->
  <rect x="205" y="745" width="54" height="193" rx="7" class="bar-r3"/>
  <rect x="267" y="876" width="54" height="62" rx="7" class="bar-dd"/>
  <text x="232" y="735" text-anchor="middle" class="number orange">6.743</text>
  <text x="294" y="866" text-anchor="middle" class="number blue">2.156</text>
  <text x="263" y="1024" text-anchor="middle" class="head">0 dB</text>

  <!-- 5 dB -->
  <rect x="435" y="798" width="54" height="140" rx="7" class="bar-r3"/>
  <rect x="497" y="868" width="54" height="70" rx="7" class="bar-dd"/>
  <text x="462" y="788" text-anchor="middle" class="number orange">4.877</text>
  <text x="524" y="858" text-anchor="middle" class="number blue">2.426</text>
  <text x="493" y="1024" text-anchor="middle" class="head">5 dB</text>

  <!-- 10 dB -->
  <rect x="665" y="877" width="54" height="61" rx="7" class="bar-r3"/>
  <rect x="727" y="875" width="54" height="63" rx="7" class="bar-dd"/>
  <text x="692" y="867" text-anchor="middle" class="number orange">2.126</text>
  <text x="754" y="865" text-anchor="middle" class="number blue">2.176</text>
  <text x="723" y="1024" text-anchor="middle" class="head">10 dB</text>

  <!-- 15 dB -->
  <rect x="895" y="938" width="54" height="36" rx="7" class="bar-r3"/>
  <rect x="957" y="892" width="54" height="46" rx="7" class="bar-dd"/>
  <text x="922" y="997" text-anchor="middle" class="number bad">−1.253</text>
  <text x="984" y="882" text-anchor="middle" class="number blue">1.616</text>
  <text x="953" y="1024" text-anchor="middle" class="head">15 dB</text>

  <text x="130" y="1070" class="small">低SNR：R3优势明显　　10 dB：接近　　15 dB：R3过处理，DD-Wiener保持正收益</text>

  <!-- Supplemental test -->
  <rect x="1210" y="664" width="536" height="430" class="panel"/>
  <text x="1238" y="708" class="section">补充证据</text>
  <text x="1238" y="742" class="small">Official test · 824对（历史上接触过，不称盲测）</text>

  <rect x="1238" y="770" width="480" height="118" rx="14" class="r3" stroke-width="2"/>
  <text x="1262" y="805" class="head orange">RNNoise R3</text>
  <text x="1262" y="838" class="body">Mean SI-SDRi</text>
  <text x="1690" y="838" text-anchor="end" class="number orange">+3.672 dB</text>
  <text x="1262" y="868" class="body">Mean ΔSTOI / RTF</text>
  <text x="1690" y="868" text-anchor="end" class="number">−0.03282 / 0.01520</text>

  <rect x="1238" y="910" width="480" height="118" rx="14" class="dd" stroke-width="2"/>
  <text x="1262" y="945" class="head blue">MCRA + DD-Wiener</text>
  <text x="1262" y="978" class="body">Mean SI-SDRi</text>
  <text x="1690" y="978" text-anchor="end" class="number blue">+2.230 dB</text>
  <text x="1262" y="1008" class="body">Mean ΔSTOI / RTF</text>
  <text x="1690" y="1008" text-anchor="end" class="number">−0.00684 / 0.00720</text>

  <rect x="1238" y="1048" width="480" height="30" rx="8" fill="#fef2f2"/>
  <text x="1478" y="1069" text-anchor="middle" class="head bad">Babble：R3 −6.718 dB；DD-Wiener +0.778 dB</text>

  <text x="64" y="1142" class="small">结论依据：客观指标 + 固定失败样本试听。正SI-SDRi不等于自然度必然提高；局部金属声和语音断续必须单独试听。</text>
</svg>
