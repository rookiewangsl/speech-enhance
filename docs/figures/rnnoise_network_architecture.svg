<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title description">
  <title id="title">RNNoise 网络结构与 DSP 处理链</title>
  <desc id="description">48 kHz 带噪语音经过 DSP 特征提取形成 65 维特征，进入两层因果卷积和三层 GRU。卷积与各层 GRU 的输出拼接为 1536 维表示，产生 32 个 ERB 频带增益和一个 VAD 概率。频带增益再由 DSP 用于 pitch filtering、频带插值、逆 FFT 和重叠相加。</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="nnPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="dspPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="outputPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c2410c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-text { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .dimension { font: 700 18px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #9a3412; }
      .panel { stroke-width: 2; rx: 22; filter: url(#shadow); }
      .dsp-panel { fill: url(#dspPanel); stroke: #93c5fd; }
      .nn-panel { fill: url(#nnPanel); stroke: #fdba74; }
      .synthesis-panel { fill: #ffffff; stroke: #93c5fd; }
      .feature-box { fill: #ffffff; stroke: #60a5fa; stroke-width: 2; rx: 15; }
      .layer-box { fill: #ffffff; stroke: #fb923c; stroke-width: 2; rx: 15; }
      .gru-box { fill: #fffaf5; stroke: #f97316; stroke-width: 2.5; rx: 15; }
      .concat-box { fill: #fffbeb; stroke: #eab308; stroke-width: 2.5; rx: 15; }
      .gain-box { fill: url(#outputPanel); stroke: #4ade80; stroke-width: 2.5; rx: 15; }
      .vad-box { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2.5; rx: 15; }
      .state-box { fill: #faf5ff; stroke: #c084fc; stroke-width: 2; stroke-dasharray: 8 6; rx: 15; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.8; marker-end: url(#arrow); }
      .flow-orange { fill: none; stroke: #c2410c; stroke-width: 2.8; marker-end: url(#arrowOrange); }
      .flow-blue { fill: none; stroke: #1d4ed8; stroke-width: 2.8; marker-end: url(#arrowBlue); }
      .skip { fill: none; stroke: #d97706; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrowOrange); }
      .state-line { fill: none; stroke: #9333ea; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; }
      .legend-text { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#background)"/>

  <text x="64" y="68" class="title">RNNoise：神经网络结构与完整降噪链</text>
  <text x="66" y="103" class="subtitle">48 kHz 单声道 · 10 ms 帧移 · 因果流式推理 · 网络估计频带增益，DSP 重建波形</text>

  <!-- DSP feature extraction -->
  <rect x="50" y="145" width="330" height="655" class="panel dsp-panel"/>
  <text x="76" y="188" class="section">① DSP 特征提取</text>

  <rect x="78" y="218" width="274" height="76" class="feature-box"/>
  <text x="215" y="249" text-anchor="middle" class="box-title">带噪 PCM 波形</text>
  <text x="215" y="275" text-anchor="middle" class="box-text">480 samples @ 48 kHz</text>

  <path d="M215 294 L215 326" class="flow-blue"/>

  <rect x="78" y="328" width="274" height="108" class="feature-box"/>
  <text x="215" y="358" text-anchor="middle" class="box-title">分析窗与频谱</text>
  <text x="215" y="385" text-anchor="middle" class="box-text">历史480点 + 当前480点</text>
  <text x="215" y="410" text-anchor="middle" class="small">960-point FFT → 481 bins</text>

  <path d="M215 436 L215 466" class="flow-blue"/>

  <rect x="78" y="468" width="274" height="112" class="feature-box"/>
  <text x="215" y="500" text-anchor="middle" class="box-title">谱包络特征</text>
  <text x="215" y="528" text-anchor="middle" class="box-text">32 ERB log energies</text>
  <text x="215" y="554" text-anchor="middle" class="dimension">DCT → 32维</text>

  <rect x="78" y="610" width="274" height="153" class="feature-box"/>
  <text x="215" y="643" text-anchor="middle" class="box-title">Pitch 特征</text>
  <text x="215" y="671" text-anchor="middle" class="box-text">历史波形搜索 pitch period</text>
  <text x="215" y="697" text-anchor="middle" class="box-text">32 ERB band correlations</text>
  <text x="215" y="724" text-anchor="middle" class="dimension">DCT → 32维 + period 1维</text>

  <!-- Neural network -->
  <rect x="410" y="145" width="1340" height="655" class="panel nn-panel"/>
  <text x="438" y="188" class="section">② 因果神经增益估计器</text>
  <text x="1717" y="188" text-anchor="end" class="small">每 10 ms 更新一次；不访问未来帧</text>

  <rect x="440" y="300" width="190" height="176" class="layer-box"/>
  <text x="535" y="335" text-anchor="middle" class="box-title">特征拼接</text>
  <line x1="462" y1="350" x2="608" y2="350" class="divider"/>
  <text x="535" y="380" text-anchor="middle" class="box-text">谱包络 32</text>
  <text x="535" y="410" text-anchor="middle" class="box-text">Pitch相关 32</text>
  <text x="535" y="440" text-anchor="middle" class="box-text">Pitch period 1</text>
  <text x="535" y="466" text-anchor="middle" class="dimension">65-d feature</text>

  <path d="M352 524 C390 524 398 388 440 388" class="flow-blue"/>
  <path d="M352 686 C400 686 397 420 440 420" class="flow-blue"/>

  <rect x="680" y="315" width="190" height="130" class="layer-box"/>
  <text x="775" y="351" text-anchor="middle" class="box-title">Causal Conv1D 1</text>
  <text x="775" y="382" text-anchor="middle" class="dimension">65 → 128</text>
  <text x="775" y="414" text-anchor="middle" class="small">kernel = 3 · 历史2帧</text>

  <path d="M630 388 L680 388" class="flow-orange"/>

  <rect x="920" y="315" width="190" height="130" class="layer-box"/>
  <text x="1015" y="351" text-anchor="middle" class="box-title">Causal Conv1D 2</text>
  <text x="1015" y="382" text-anchor="middle" class="dimension">128 → 384</text>
  <text x="1015" y="414" text-anchor="middle" class="small">kernel = 3 · 历史2帧</text>

  <path d="M870 380 L920 380" class="flow-orange"/>

  <rect x="1155" y="230" width="190" height="104" class="gru-box"/>
  <text x="1250" y="267" text-anchor="middle" class="box-title">GRU 1</text>
  <text x="1250" y="299" text-anchor="middle" class="dimension">384 → 384</text>

  <rect x="1155" y="390" width="190" height="104" class="gru-box"/>
  <text x="1250" y="427" text-anchor="middle" class="box-title">GRU 2</text>
  <text x="1250" y="459" text-anchor="middle" class="dimension">384 → 384</text>

  <rect x="1155" y="550" width="190" height="104" class="gru-box"/>
  <text x="1250" y="587" text-anchor="middle" class="box-title">GRU 3</text>
  <text x="1250" y="619" text-anchor="middle" class="dimension">384 → 384</text>

  <path d="M1110 380 C1132 380 1130 282 1155 282" class="flow-orange"/>
  <path d="M1250 334 L1250 390" class="flow-orange"/>
  <path d="M1250 494 L1250 550" class="flow-orange"/>

  <rect x="1390" y="245" width="145" height="430" class="concat-box"/>
  <text x="1462" y="286" text-anchor="middle" class="box-title">Concat</text>
  <text x="1462" y="319" text-anchor="middle" class="dimension">1536-d</text>
  <line x1="1412" y1="337" x2="1513" y2="337" class="divider"/>
  <text x="1462" y="377" text-anchor="middle" class="box-text">Conv2</text>
  <text x="1462" y="424" text-anchor="middle" class="box-text">GRU1</text>
  <text x="1462" y="471" text-anchor="middle" class="box-text">GRU2</text>
  <text x="1462" y="518" text-anchor="middle" class="box-text">GRU3</text>
  <text x="1462" y="633" text-anchor="middle" class="small">共享时序表示</text>

  <path d="M1110 365 C1350 365 1348 377 1390 377" class="skip"/>
  <path d="M1345 282 C1372 282 1362 424 1390 424" class="skip"/>
  <path d="M1345 442 C1370 442 1367 471 1390 471" class="skip"/>
  <path d="M1345 602 C1375 602 1360 518 1390 518" class="skip"/>

  <rect x="1580" y="280" width="140" height="126" class="gain-box"/>
  <text x="1650" y="316" text-anchor="middle" class="box-title">Gain Head</text>
  <text x="1650" y="348" text-anchor="middle" class="dimension">1536 → 32</text>
  <text x="1650" y="380" text-anchor="middle" class="small">Sigmoid · ERB gains</text>

  <rect x="1580" y="525" width="140" height="126" class="vad-box"/>
  <text x="1650" y="561" text-anchor="middle" class="box-title">VAD Head</text>
  <text x="1650" y="593" text-anchor="middle" class="dimension">1536 → 1</text>
  <text x="1650" y="625" text-anchor="middle" class="small">Sigmoid probability</text>

  <path d="M1535 360 L1580 343" class="flow-orange"/>
  <path d="M1535 555 L1580 588" class="flow-orange"/>

  <rect x="675" y="690" width="665" height="78" class="state-box"/>
  <text x="1007" y="720" text-anchor="middle" class="box-title">Persistent neural state（跨帧保存）</text>
  <text x="1007" y="749" text-anchor="middle" class="box-text">Conv1/Conv2 历史输入 + GRU1/GRU2/GRU3 hidden states</text>
  <path d="M770 690 C770 665 775 466 775 445" class="state-line"/>
  <path d="M1000 690 C1000 665 1015 468 1015 445" class="state-line"/>
  <path d="M1220 690 C1200 675 1200 666 1215 654" class="state-line"/>

  <!-- DSP synthesis -->
  <rect x="50" y="835" width="1700" height="220" class="panel synthesis-panel"/>
  <text x="76" y="880" class="section">③ DSP 增强与波形重建</text>

  <rect x="85" y="912" width="250" height="100" class="feature-box"/>
  <text x="210" y="946" text-anchor="middle" class="box-title">Delayed spectrum</text>
  <text x="210" y="976" text-anchor="middle" class="box-text">当前频谱 + pitch频谱</text>
  <text x="210" y="999" text-anchor="middle" class="small">含 analysis / pitch 历史</text>

  <rect x="425" y="912" width="230" height="100" class="feature-box"/>
  <text x="540" y="946" text-anchor="middle" class="box-title">Pitch filtering</text>
  <text x="540" y="976" text-anchor="middle" class="box-text">强化相干谐波结构</text>

  <rect x="755" y="912" width="250" height="100" class="feature-box"/>
  <text x="880" y="946" text-anchor="middle" class="box-title">Gain interpolation</text>
  <text x="880" y="976" text-anchor="middle" class="dimension">32 bands → 481 bins</text>

  <rect x="1105" y="912" width="245" height="100" class="feature-box"/>
  <text x="1227" y="946" text-anchor="middle" class="box-title">iFFT + window</text>
  <text x="1227" y="976" text-anchor="middle" class="box-text">Overlap-add synthesis</text>

  <rect x="1450" y="912" width="250" height="100" class="gain-box"/>
  <text x="1575" y="946" text-anchor="middle" class="box-title">增强语音输出</text>
  <text x="1575" y="976" text-anchor="middle" class="box-text">480 samples @ 48 kHz</text>
  <text x="1575" y="999" text-anchor="middle" class="small">核心固定延迟：10 ms</text>

  <path d="M335 962 L425 962" class="flow-blue"/>
  <path d="M655 962 L755 962" class="flow-blue"/>
  <path d="M1005 962 L1105 962" class="flow-blue"/>
  <path d="M1350 962 L1450 962" class="flow-blue"/>
  <path d="M1650 406 C1650 760 880 792 880 912" class="flow-orange"/>

  <rect x="1445" y="1068" width="18" height="18" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1472" y="1083" class="legend-text">DSP</text>
  <rect x="1530" y="1068" width="18" height="18" rx="4" fill="#ffedd5" stroke="#fb923c"/>
  <text x="1557" y="1083" class="legend-text">Neural network</text>
  <rect x="1690" y="1068" width="18" height="18" rx="4" fill="#faf5ff" stroke="#c084fc"/>
  <text x="1717" y="1083" class="legend-text">State</text>

  <text x="76" y="1090" class="small">注：VAD 是辅助概率输出；真正施加到频谱上的主控制量是 32 个连续 ERB band gains。</text>
</svg>
