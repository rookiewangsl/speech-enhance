[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "mandarin-reverberation-robust-asr"
version = "0.1.0"
description = "Controlled Mandarin reverberation-robust ASR experiments with WPE and Whisper LoRA"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.13",
    "scipy>=1.14",
]

[project.optional-dependencies]
asr = [
    "nara-wpe>=0.0.0",
    "opencc-python-reimplemented>=0.1.7",
    "pyroomacoustics>=0.8",
    "torch==2.13.0",
    "transformers>=4.46,<6",
]
train = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "peft>=0.13",
]
evaluation = [
    "matplotlib>=3.9",
    "pystoi>=0.4",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["robust_asr*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
