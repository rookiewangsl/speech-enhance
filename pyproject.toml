[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-speech-enhancement"
version = "0.1.0"
description = "Explainable streaming VAD and single-channel speech enhancement"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.13",
    "scipy>=1.14",
]

[project.optional-dependencies]
data = []
evaluation = [
    "matplotlib>=3.9",
    "pystoi>=0.4",
]
external = [
    "webrtcvad-wheels>=2.0.14",
]
demo = [
    "sounddevice>=0.5",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
